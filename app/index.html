<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:"><title>CLO AI</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="profile-controls.css"><link rel="stylesheet" href="cursor-suction.css"><link rel="stylesheet" href="quiet-reveal.css"><link rel="stylesheet" href="chat-typing.css"></head><body>
<section id="auth-screen" class="onboarding" aria-label="Подключение ChatGPT"><button id="auth-connect" class="shimmer headline" disabled>Подключи ChatGPT,<br>чтобы мы могли общаться</button><p id="auth-notice" class="onboarding-notice" role="status" hidden></p></section>
<section id="bridge-screen" class="onboarding" aria-label="Подключение CLO" hidden><img id="bridge-guide" src="assets/bridge-guide.svg" alt="Как подключить плагин к CLO 3D" width="460" height="230" loading="lazy" decoding="async"><button id="bridge-copy" class="shimmer headline">Скопируй команду<br>в консоль CLO, и начнём.</button><p id="bridge-notice" class="onboarding-notice" role="status"></p></section>
<div id="workspace" class="app-shell" hidden><nav class="tabs" role="tablist" aria-label="Основные разделы"><button id="tab-chat" role="tab" aria-selected="true" aria-controls="page-chat" data-tab="chat">Чат</button><button id="tab-profiles" role="tab" aria-selected="false" aria-controls="page-profiles" tabindex="-1" data-tab="profiles">Профиль</button></nav><main>
<section id="page-chat" role="tabpanel" aria-labelledby="tab-chat" class="chat-page"><div id="chat-notice" class="notice" role="status" hidden></div><div id="history" class="history" role="log" aria-label="История диалога" aria-live="polite" aria-relevant="additions" tabindex="0"></div><button id="latest" class="latest" hidden>К последнему сообщению</button><div id="operation" class="operation" role="status" aria-live="polite" hidden></div>
<form id="composer" class="composer"><div id="edit-context" class="notice" hidden></div><div class="input-area"><label for="text" class="sr-only">Твоя идея или уточнение</label><textarea id="text" rows="2" placeholder="Что создадим сегодня?" maxlength="20000"></textarea><p id="compose-hint">Опишите идею, а я помогу превратить её в лекала.</p></div><div class="composer-actions"><button id="attach-reference" type="button">Добавить референс</button><div id="reference-strip" class="reference-strip" hidden><div id="reference-scroll" class="reference-scroll" tabindex="0" aria-label="Референсы"><div id="reference-list" class="reference-list"></div><button id="add-reference" type="button">Добавить</button></div></div><button id="send" type="submit" disabled>Отправить</button></div></form></section>
<section id="page-profiles" class="scroll-page" role="tabpanel" aria-labelledby="tab-profiles" hidden><div id="profiles-root"></div><footer class="profile-footer"><button id="reauth-chatgpt">Перезайти в ChatGPT</button><p id="reauth-error" class="notice" role="status" hidden></p></footer></section></main></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-heading"><h1 id="editor-title"></h1><button id="editor-close" type="button">Закрыть</button></div><div id="editor-fields" class="dialog-body"></div><div id="editor-error" class="notice error" role="alert" hidden></div><div class="dialog-actions"><button id="editor-cancel" type="button">Отмена</button><button id="editor-save" type="submit">Сохранить</button></div></form></dialog>
<script src="ui-format.js"></script><script src="cursor-suction.js"></script><script src="chat-typing.js"></script><script src="quiet-reveal.js"></script><script src="ui-shell.js"></script><script src="completion-sound.js"></script><script src="completion-feedback.js"></script><script src="chat-renderer.js"></script><script src="chat-typography.js"></script><script src="assets/measurements/manifest.js"></script><script src="measurement-help.js"></script><script src="sewing-map.js"></script><script src="assembly-ui.js"></script><script src="renderer.js"></script><script src="profile-controls.js"></script><script src="measurement-fields.js"></script><script src="profiles-ui.js"></script><script src="scroll-fade.js"></script></body></html>
